name: CI

on:
  push:
  pull_request:

jobs:
  web:
    name: Web (app/)
    runs-on: ubuntu-latest
    # Only the Vite/React SPA runs in CI for now. The Tauri shell in
    # src-tauri/ links WebKitGTK + GTK on Linux, which this runner doesn't
    # have installed, so `cargo check`/`cargo build` for the Rust side is
    # left for a later workflow that provisions those system packages.
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
