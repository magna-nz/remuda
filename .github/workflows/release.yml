name: Release

# Tag-triggered release build. Push a `v*` tag (e.g. `v0.1.0`) to build the
# macOS app bundle and publish it as a GitHub release asset.
#
# Distribution is Homebrew, not a DMG (SPEC.md §10) — this workflow produces
# the tarball a Homebrew cask points `url` at; it does not build or upload a
# .dmg. The cask is rendered from packaging/homebrew/remuda.rb with this
# release's version and SHA-256 filled in, attached to the release, and — if
# a TAP_GITHUB_TOKEN secret is configured — pushed to the tap repo.
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build macOS app & publish release
    runs-on: macos-14
    env:
      # Read via env rather than the `secrets` context directly so the tap
      # step can be skipped with a plain `if:` when the secret isn't set.
      TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      # Fail before spending a build on a tag that disagrees with the
      # versions baked into the artifact. tauri.conf.json's version is what
      # stamps the .app's Info.plist, so a mismatch here ships a release
      # named v0.2.0 containing an app that reports 0.1.0.
      - name: Verify tag matches the versions in the repo
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"

          tauri=$(jq -r '.version' src-tauri/tauri.conf.json)
          npm_pkg=$(jq -r '.version' app/package.json)
          cargo=$(grep -m1 '^version = ' src-tauri/Cargo.toml | sed 's/^version = "\(.*\)"$/\1/')

          echo "tag                    ${tag} -> ${version}"
          echo "src-tauri/tauri.conf.json  ${tauri}"
          echo "src-tauri/Cargo.toml       ${cargo}"
          echo "app/package.json           ${npm_pkg}"

          fail=0
          for pair in "src-tauri/tauri.conf.json:${tauri}" \
                      "src-tauri/Cargo.toml:${cargo}" \
                      "app/package.json:${npm_pkg}"; do
            file="${pair%%:*}"
            found="${pair#*:}"
            if [ "$found" != "$version" ]; then
              echo "::error file=${file}::version is ${found}, but the tag says ${version}"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Bump every version to ${version}, commit, and re-tag." >&2
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-release-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-release-

      - name: Install frontend dependencies
        working-directory: app
        run: npm ci

      - name: Build frontend
        working-directory: app
        run: npm run build

      # Installed via npm rather than `cargo install tauri-cli`: the npm
      # package ships a precompiled binary, so this is a download, not a
      # from-source compile — much faster and friendlier to the runner's
      # cache than rebuilding tauri-cli on every release.
      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@^2

      # Run from src-tauri/, matching the documented local dev flow
      # (README.md "Development": `cargo tauri dev` from src-tauri/), so the
      # `beforeBuildCommand` hook in tauri.conf.json resolves the same way
      # it does for a developer running the equivalent `dev` command by
      # hand. The frontend is also pre-built above so the hook re-running
      # `npm run build` is redundant, not load-bearing.
      #
      # macos-14 GitHub runners are Apple Silicon (arm64), so this produces
      # an aarch64-only .app. An x86_64 (or universal) build is a follow-up
      # — see the TODO below and SPEC.md §10/§12.8.
      - name: Build the app bundle
        working-directory: src-tauri
        run: tauri build

      # --------------------------------------------------------------
      # TODO: code signing & notarization.
      #
      # This build is UNSIGNED. Without a signing identity, Gatekeeper
      # will refuse to open the .app on another Mac ("Remuda.app is
      # damaged and can't be opened" / "unidentified developer"), which is
      # why packaging/homebrew/remuda.rb's `caveats` block currently tells
      # installers to run:
      #   xattr -dr com.apple.quarantine /Applications/Remuda.app
      #
      # To sign and notarize once a Developer ID is available, this step
      # would need, roughly:
      #   1. Secrets: APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
      #      APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD (app-specific
      #      password or API key), APPLE_TEAM_ID.
      #   2. Import the certificate into a temporary keychain before the
      #      `tauri build` step (tauri-apps/tauri-action or a manual
      #      `security create-keychain` / `security import` sequence), and
      #      set tauri.conf.json's `bundle.macOS.signingIdentity`.
      #   3. After `tauri build` produces the signed .app, notarize it:
      #      `xcrun notarytool submit <bundle>.zip --apple-id ... --team-id ...
      #      --password ... --wait`, then `xcrun stapler staple Remuda.app`.
      #   4. Only once that's in place should the cask's `caveats` note about
      #      quarantine be removed.
      # --------------------------------------------------------------

      - name: Package the .app as a tarball
        id: package
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          bundle_dir="src-tauri/target/release/bundle/macos"
          asset="Remuda-${version}-aarch64.tar.gz"
          tar -czf "$asset" -C "$bundle_dir" "Remuda.app"
          shasum -a 256 "$asset" > "${asset}.sha256"
          echo "asset=${asset}" >> "$GITHUB_OUTPUT"
          echo "sha256=$(cut -d ' ' -f1 "${asset}.sha256")" >> "$GITHUB_OUTPUT"

      # Renders the cask template with this release's version and checksum.
      # The result is attached to the release, so the tap can be updated by
      # copying one file even when the automated push below is skipped.
      - name: Render the Homebrew cask
        id: cask
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          sha256="${{ steps.package.outputs.sha256 }}"

          mkdir -p rendered-cask
          sed \
            -e "s|^  version \".*\"|  version \"${version}\"|" \
            -e "s|^  sha256 \".*\"|  sha256 \"${sha256}\"|" \
            packaging/homebrew/remuda.rb > rendered-cask/remuda.rb

          # Assert the substitutions actually landed, rather than shipping a
          # cask that still points at the template's placeholder values.
          got_version=$(grep -m1 '^  version ' rendered-cask/remuda.rb | sed 's/^  version "\(.*\)"$/\1/')
          got_sha=$(grep -m1 '^  sha256 ' rendered-cask/remuda.rb | sed 's/^  sha256 "\(.*\)"$/\1/')
          if [ "$got_version" != "$version" ] || [ "$got_sha" != "$sha256" ]; then
            echo "::error file=packaging/homebrew/remuda.rb::cask substitution failed (version=${got_version}, sha256=${got_sha})"
            exit 1
          fi
          echo "Rendered cask: version ${got_version}, sha256 ${got_sha}"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ steps.package.outputs.asset }}
            ${{ steps.package.outputs.asset }}.sha256
            rendered-cask/remuda.rb
          body: |
            macOS (Apple Silicon / aarch64) build, **unsigned** — see the
            signing TODO in .github/workflows/release.yml. Installers will
            need to clear the quarantine attribute; see
            packaging/homebrew/remuda.rb.

            SHA-256: `${{ steps.package.outputs.sha256 }}`

            The `remuda.rb` asset on this release is the Homebrew cask with
            this version and checksum already filled in. It is pushed to
            magna-nz/homebrew-tap automatically when the TAP_GITHUB_TOKEN
            secret is set; otherwise copy it to `Casks/remuda.rb` in the tap
            repo by hand. See packaging/homebrew/README.md.

      # Runs after the release is published, not before: the cask's `url`
      # points at this release's asset, so a tap updated any earlier would
      # send `brew install` at a URL that 404s.
      #
      # Needs a PAT with write access to magna-nz/homebrew-tap in the
      # TAP_GITHUB_TOKEN secret — the built-in GITHUB_TOKEN is scoped to this
      # repo and cannot push to another one. Without the secret this step is
      # skipped and the tap is updated by hand from the release asset.
      - name: Push the cask to the tap repo
        if: env.TAP_TOKEN != ''
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"

          git clone --depth 1 \
            "https://x-access-token:${TAP_TOKEN}@github.com/magna-nz/homebrew-tap.git" tap
          mkdir -p tap/Casks
          cp rendered-cask/remuda.rb tap/Casks/remuda.rb

          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Casks/remuda.rb
          if git diff --cached --quiet; then
            echo "Tap already carries this cask — nothing to push."
          else
            git commit -m "remuda ${version}"
            git push
            echo "Pushed remuda ${version} to magna-nz/homebrew-tap."
          fi

      - name: Note when the tap was not updated
        if: env.TAP_TOKEN == ''
        run: |
          echo "::notice::TAP_GITHUB_TOKEN is not set, so magna-nz/homebrew-tap was not updated. Copy the remuda.rb asset from this release into the tap's Casks/ directory."
