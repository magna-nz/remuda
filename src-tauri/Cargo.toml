[package]
name = "remuda"
version = "0.1.1"
description = "A chat-first desktop UI for Ollama"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Registry probe only (SPEC §5.5). rustls so we don't bind to system OpenSSL;
# default features off keeps native-tls and the blocking client out of the tree.
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "gzip"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
