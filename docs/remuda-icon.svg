<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Remuda app icon: the README logomark (docs/remuda-mark.svg) laid out on
       Apple's macOS icon grid — an 824x824 body centred in a 1024 canvas, so the
       Dock's own padding isn't doubled up. Source for `cargo tauri icon`. -->
  <defs>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5f63c4"/>
      <stop offset="1" stop-color="#6b4fa8"/>
    </linearGradient>
    <filter id="lift" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <!-- 96-unit logomark coordinates, scaled 824/96 and offset to the icon body. -->
  <g transform="translate(100 100) scale(8.583333) translate(-4 -4)">
    <g filter="url(#lift)">
      <rect x="4" y="4" width="96" height="96" rx="22" fill="url(#brand)"/>
    </g>
    <rect x="4" y="4" width="96" height="96" rx="22" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>
    <path d="M52 24l26 14v22c0 15-11 22.5-26 30-15-7.5-26-15-26-30V38z"
          fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
